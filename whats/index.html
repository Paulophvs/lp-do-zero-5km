<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Abrindo o WhatsApp...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f1115;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 340px; }
    .zap {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #25D366;
      display: flex; align-items: center; justify-content: center;
    }
    .zap svg { width: 36px; height: 36px; fill: #fff; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 14px; color: #9aa0a6; line-height: 1.5; }
    a.btn {
      display: inline-block;
      margin-top: 18px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 22px;
      border-radius: 999px;
    }
    .dots::after { content: ''; animation: d 1.2s steps(4, end) infinite; }
    @keyframes d { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="zap">
      <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.03c-.24.68-1.4 1.3-1.94 1.34-.5.04-.97.22-3.28-.68-2.77-1.09-4.53-3.92-4.67-4.1-.14-.18-1.12-1.49-1.12-2.84s.71-2.02.96-2.29c.25-.27.55-.34.73-.34.18 0 .37 0 .53.01.17.01.4-.06.62.48.24.56.8 1.94.87 2.08.07.14.12.31.02.49-.09.18-.14.29-.28.45-.14.16-.29.35-.42.47-.14.14-.28.29-.12.57.16.28.72 1.19 1.55 1.93 1.07.95 1.97 1.25 2.25 1.39.28.14.44.12.6-.07.16-.18.69-.8.87-1.08.18-.28.37-.23.62-.14.25.09 1.6.75 1.87.89.28.14.46.21.53.32.07.12.07.65-.17 1.33z"/></svg>
    </div>
    <h1>Abrindo o WhatsApp<span class="dots"></span></h1>
    <p>Se não abrir sozinho em alguns segundos, toque no botão.</p>
    <a class="btn" id="manual" href="#" rel="nofollow">Abrir conversa</a>
  </div>

  <script>
    (function () {
      var NUMERO   = '5571994102328';
      var PIXEL_ID = '1803401826472530';

      // ------------------------------------------------------------------
      // MENSAGENS PRONTAS. Pra trocar a mensagem NAO precisa mexer no site:
      // basta mudar o final do link que voce publica.
      //   /whats                    -> mensagem padrao
      //   /whats?m=diagnostico      -> pede o diagnostico
      //   /whats?m=5km              -> quem quer sair do zero aos 5km
      //   /whats?m=preco            -> quer valor da assessoria
      //   /whats?m=planilha         -> quer a planilha
      //   /whats?t=Texto+livre      -> qualquer texto na hora, sem deploy
      // E o canal de origem (aparece pra voce e no relatorio do Pixel):
      //   /whats?c=bio  ?c=story  ?c=ads  ?c=site
      // Da pra combinar: /whats?c=story&m=diagnostico
      // ------------------------------------------------------------------
      var ABERTURA = 'Olá Paulo! ';
      var ASSUNTOS = {
        padrao:      'Quero saber sobre a assessoria Km3 Corridas. Hoje eu corro ___ vezes por semana e meu objetivo é ___',
        diagnostico: 'Quero fazer o diagnóstico da minha corrida. Hoje eu corro ___ vezes por semana, meu melhor tempo é ___ e meu objetivo é ___',
        '5km':       'Quero sair do zero aos 5 km. Hoje eu corro ___ vezes por semana.',
        preco:       'Quero saber o valor da assessoria Km3 Corridas e como funciona.',
        planilha:    'Quero a planilha de treino. Hoje eu corro ___ vezes por semana e meu objetivo é ___',
        duvida:      'Tenho uma dúvida sobre a assessoria Km3 Corridas.'
      };
      var CANAIS = {
        bio:   'Vim pelo link da bio. ',
        story: 'Vim pelo story. ',
        ads:   'Vim pelo anúncio. ',
        site:  'Vim pelo site. '
      };

      var q       = new URLSearchParams(window.location.search);
      var canal   = (q.get('c') || '').toLowerCase().slice(0, 20);
      var assunto = (q.get('m') || '').toLowerCase().slice(0, 20);
      var livre   = (q.get('t') || '').slice(0, 300);

      var corpo = livre || ASSUNTOS[assunto] || ASSUNTOS.padrao;
      var texto = livre ? corpo : (ABERTURA + (CANAIS[canal] || '') + corpo);

      var destino = 'https://wa.me/' + NUMERO + '?text=' + encodeURIComponent(texto);
      document.getElementById('manual').href = destino;

      // ------------------------------------------------------------------
      // Medicao. O mesmo event_id vai no Pixel (browser) e na CAPI (servidor),
      // entao a Meta deduplica e conta 1 evento so, com o dobro de chance de chegar.
      // ------------------------------------------------------------------
      var eventId = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + '-' + Math.random().toString(16).slice(2);

      function cookie(nome) {
        var m = document.cookie.match('(^|;)\\s*' + nome + '\\s*=\\s*([^;]+)');
        return m ? m.pop() : undefined;
      }

      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      try {
        fbq('init', PIXEL_ID);
        fbq('track', 'PageView');
        fbq('track', 'Contact',
          { content_name: 'clique-whatsapp', canal: canal || 'direto', assunto: assunto || 'padrao' },
          { eventID: eventId });
      } catch (e) {}

      // fbc: se a pessoa veio de anuncio, a URL traz fbclid. Melhora o match na Meta.
      var fbclid = q.get('fbclid');
      var fbc = cookie('_fbc') || (fbclid ? 'fb.1.' + Date.now() + '.' + fbclid : undefined);

      var dados = JSON.stringify({
        event_id: eventId,
        canal: canal || 'direto',
        assunto: livre ? 'texto-livre' : (assunto || 'padrao'),
        source_url: window.location.href,
        fbp: cookie('_fbp'),
        fbc: fbc
      });

      // sendBeacon sobrevive ao redirect (fetch normal seria cortado no meio).
      try {
        var enviou = false;
        if (navigator.sendBeacon) {
          enviou = navigator.sendBeacon('/api/contact', new Blob([dados], { type: 'application/json' }));
        }
        if (!enviou) {
          fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: dados,
            keepalive: true
          }).catch(function () {});
        }
      } catch (e) {}

      // Redireciona sozinho. O atraso curto e so pro pixel do browser disparar.
      setTimeout(function () { window.location.replace(destino); }, 700);
    })();
  </script>
</body>
</html>
